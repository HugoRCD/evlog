name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded pushes on a PR, but let every push to main finish: each
  # one is the input to a release.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Fork PRs get no OIDC token, so they use the local cache instead of failing
  # to reach the remote one.
  IS_INTERNAL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  TURBO_CACHE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'remote:rw' || 'local:rw' }}
  # Without a base, turbo cannot resolve the git range and silently treats
  # every package as affected.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # remote cache OIDC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # --affected needs history to diff against the base
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup

      # turbo runs both tasks concurrently and knows their dependency graph, so
      # this stays one command rather than two parallel steps.
      - name: Lint & typecheck
        run: pnpm exec turbo run lint typecheck --affected

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # remote cache OIDC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup

      # evlog is excluded here because its suite runs once below under coverage,
      # which also enforces the thresholds in vitest.config.ts.
      - name: Test workspace
        run: pnpm exec turbo run test --affected --filter='!evlog'

      - name: Test evlog with coverage
        run: pnpm --filter evlog run test:coverage

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # remote cache OIDC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup

      # --continue so one broken example reports every other one too, instead of
      # cancelling them and hiding whether they are healthy.
      - name: Build affected examples
        run: pnpm exec turbo run build --affected --continue --filter='./examples/*'

  publish:
    name: Publish preview package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately not gated on the other jobs: a preview build is most useful
    # while the PR is still red.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # remote cache OIDC
      pull-requests: write # pkg-pr-new comments the preview install command
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm run build:package

      - name: Publish
        run: pnpx pkg-pr-new publish --compact --no-template --pnpm './packages/evlog' './packages/nuxthub' './packages/telemetry' './packages/cli'

  # Single required check for branch protection: the job names above can change
  # without anyone having to update the protection rules.
  ci:
    name: ci
    runs-on: ubuntu-slim
    needs: [quality, test, examples]
    if: always()
    steps:
      - name: Verify every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
