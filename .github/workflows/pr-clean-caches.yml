name: clean branch caches

# The pnpm store cache is keyed per branch, so merged and closed PRs leave
# entries behind. The repo-wide Actions cache quota is 10 GB and evicts by
# least-recently-used, which would otherwise start evicting main's cache.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose caches should be deleted
        required: true
        type: string

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: write # deletes this branch's cache entries
    steps:
      - name: Delete caches for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # workflow_dispatch carries no pull_request payload, so a manual run
          # supplies the number instead.
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          ids=$(gh api --method GET "repos/$REPO/actions/caches" \
            -f ref="refs/pull/$PR/merge" -f per_page=100 --jq '.actions_caches[].id')

          # Best effort: a cleanup failure must never fail the workflow.
          set +e
          for id in $ids; do
            gh api --method DELETE "repos/$REPO/actions/caches/$id"
          done
          echo "Done"
