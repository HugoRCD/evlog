name: clean branch caches

# The pnpm store cache is keyed per branch, so merged and closed PRs leave
# entries behind. The repo-wide Actions cache quota is 10 GB and evicts by
# least-recently-used, which would otherwise start evicting main's cache.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Delete caches for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh api --method GET "repos/$REPO/actions/caches" \
            -f ref="$BRANCH" -f per_page=100 --jq '.actions_caches[].id')

          # Best effort: a cleanup failure must never fail the workflow.
          set +e
          for id in $ids; do
            gh api --method DELETE "repos/$REPO/actions/caches/$id"
          done
          echo "Done"
