name: evi evals

# Behavioural tests for the Evi agent. Every run spends real gateway tokens on
# a live model, so this is deliberately NOT part of `ci` and never runs just
# because a file under apps/evi changed.
#
# What triggers a run, and what it costs:
#   - a PR labelled `evals`, from this repo only — the 12 `fast` evals. Opt-in,
#     the same shape as the `e2e` label, because the author is the one who
#     knows a change alters behaviour rather than wording.
#   - a push to main that touched the agent itself (instructions, tools,
#     skills, model) — the full 20. One trend point per behaviour change that
#     actually shipped, which is what makes cost and latency comparable over
#     time. Test-only edits are excluded.
#   - a weekly cron — the full 20, to catch drift that lands without a commit
#     (a provider silently updating the model behind the id).
#   - workflow_dispatch with a model — the full 20 against a candidate, to
#     compare cost, latency and pass rate before swapping agent.ts.
#
# Results reach PostHog as `evi_eval` / `evi_eval_run`, joined to the agent's
# LLM traces by the eve session id. Spend is tagged `evi:env:eval` on the
# gateway, so an eval bill is never confused with production traffic.

on:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches:
      - main
    paths:
      - 'apps/evi/agent/**'
      - '!apps/evi/agent/**/*.test.ts'
      - '.github/workflows/evi-evals.yml'
  pull_request:
    types: [labeled, synchronize, opened]
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the suite against (defaults to the one in agent.ts)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: evi-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    # Unlabelled and fork PRs never spend anything.
    if: |
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'evals')
        && github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # eve requires Node >= 24; the repo pins 22 for everything else.
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          filters: '--filter=evi...'

      # apps/evi resolves `evlog/eve` and `evlog/posthog` through the workspace
      # link, which points at dist.
      - name: Build evlog
        run: pnpm --filter evlog run build

      - name: Run evals
        run: >
          pnpm --filter evi exec eve eval
          ${{ github.event_name == 'pull_request' && '--tag fast' || '' }}
          --junit evi-evals.xml
        env:
          EVE_RUN_MODE: eval
          EVI_MODEL: ${{ inputs.model }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evi-evals-${{ github.run_id }}
          path: apps/evi/evi-evals.xml
          if-no-files-found: ignore
