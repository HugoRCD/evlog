# Auto-provisioned so Grafana is usable the moment it boots — no clicking.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Loki 3 needs this to expose structured metadata / newer query features.
      timeout: 60
      maxLines: 1000
